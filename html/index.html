<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bewerbungstracker – Neue Bewerbung</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<nav class="nav">
  <a class="nav-brand" href="index.html">Bewerbungstracker</a>
  <a class="nav-link active" href="index.html">+ Neue Bewerbung</a>
  <a class="nav-link" href="overview.html">Übersicht</a>
</nav>

<div class="page">
  <div style="max-width:680px;margin:0 auto">
    <h1 class="page-title">Neue Bewerbung</h1>
    <p class="page-subtitle">Bewerbung erfassen und zentral speichern.</p>

    <div class="card">
      <!-- Pflichtfelder -->
      <div class="section-label">Pflichtfelder</div>

      <label for="company" class="req">Unternehmen</label>
      <input type="text" id="company" placeholder="z. B. WERTGRUND" autocomplete="organization" />

      <label for="date" class="req">Bewerbungsdatum</label>
      <input type="date" id="date" />

      <!-- Stelle -->
      <div class="section-label">Stelle <span class="opt">optional</span></div>

      <label for="jobtitle">Jobtitel</label>
      <input type="text" id="jobtitle" placeholder="z. B. AI Automation Engineer" />

      <label for="link">Link zur Stelle</label>
      <input type="url" id="link" placeholder="https://..." />

      <div class="row">
        <div>
          <label for="status">Status</label>
          <select id="status">
            <option>Beworben</option>
            <option>Interview</option>
            <option>Warten</option>
            <option>Abgelehnt</option>
            <option>Angebot</option>
          </select>
        </div>
      </div>

      <!-- Ansprechpartner -->
      <div class="section-label">Ansprechpartner <span class="opt">optional</span></div>
      <div class="collapsible-header" id="contactToggle" onclick="toggleContact()">
        <span>Angaben zum Ansprechpartner hinzufügen</span>
        <span class="chevron">▼</span>
      </div>
      <div class="collapsible-body" id="contactBody">
        <div class="row" style="margin-top:12px">
          <div>
            <label for="contact_name">Name</label>
            <input type="text" id="contact_name" placeholder="Vorname Nachname" />
          </div>
          <div>
            <label for="contact_position">Position</label>
            <input type="text" id="contact_position" placeholder="z. B. HR Manager" />
          </div>
        </div>
        <div class="row">
          <div>
            <label for="contact_email">E-Mail</label>
            <input type="email" id="contact_email" placeholder="name@firma.de" />
          </div>
          <div>
            <label for="contact_phone">Telefon</label>
            <input type="tel" id="contact_phone" placeholder="+49 ..." />
          </div>
        </div>
      </div>

      <!-- Notizen -->
      <div class="section-label">Notizen <span class="opt">optional</span></div>
      <label for="notes">Anforderungen, Eindruck, Aufgaben …</label>
      <textarea id="notes" placeholder="Was war wichtig?"></textarea>

      <button class="btn-primary full" id="submitBtn" onclick="handleSubmit()">
        Bewerbung speichern
      </button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="app.js"></script>
<script src="index.js"></script>
</body>
</html>
