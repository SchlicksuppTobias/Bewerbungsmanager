version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: bewerbung_nginx
    ports:
      - "8080:80"
    volumes:
      - ./html:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - bewerbung_net

  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: bewerbung_php
    volumes:
      - ./html:/var/www/html
    environment:
      DB_HOST: mariadb
      DB_NAME: bewerbungen
      DB_USER: bewerbung_user
      DB_PASS: sicheres_passwort123
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - bewerbung_net

  mariadb:
    image: mariadb:11
    container_name: bewerbung_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: rootpasswort123
      MYSQL_DATABASE: bewerbungen
      MYSQL_USER: bewerbung_user
      MYSQL_PASSWORD: sicheres_passwort123
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./php/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "3306:3306"
    networks:
      - bewerbung_net

volumes:
  mariadb_data:

networks:
  bewerbung_net:
    driver: bridge
